<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Hace que la página sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - Ferretería Los Maestros</title>

    <!-- Bootstrap: diseño responsive, navbar y formularios -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- ================= MENÚ ================= -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <!-- Nombre/logo de la tienda -->
        <a class="navbar-brand" href="index.html">
            Ferretería Los Maestros
        </a>

        <!-- Botón del menú para pantallas pequeñas -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Enlaces principales -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="productos.html">Productos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="nosotros.html">Nosotros</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="carrito.html">Carrito</a>
                </li>

                <!-- Se muestran cuando NO hay sesión -->
                <li class="nav-item ms-lg-2" id="nav-login">
                    <a class="btn btn-outline-primary btn-sm"
                       href="login.html">
                        Iniciar Sesión
                    </a>
                </li>

                <li class="nav-item ms-lg-2 mt-2 mt-lg-0"
                    id="nav-registro">
                    <a class="btn btn-primary btn-sm"
                       href="registro.html">
                        Registrarse
                    </a>
                </li>

                <!-- Se muestran cuando SÍ hay sesión -->
                <li class="nav-item ms-lg-3 d-none"
                    id="nav-usuario">
                    <span class="fw-bold"
                          id="nav-usuario-nombre"></span>
                </li>

                <li class="nav-item ms-lg-2 mt-2 mt-lg-0 d-none"
                    id="nav-logout">
                    <button type="button"
                            class="btn btn-outline-secondary btn-sm"
                            onclick="cerrarSesion()">
                        Cerrar sesión
                    </button>
                </li>

            </ul>
        </div>
    </div>
</nav>


<!-- ================= FORMULARIO LOGIN ================= -->
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">

        <!-- El formulario ocupa 6 de las 12 columnas en pantallas medianas -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">

                    <h1 class="mb-4 text-center">
                        Iniciar Sesión
                    </h1>

                    <!--
                        Al enviar el formulario se ejecuta validarLogin().
                        Si devuelve false, evita que la página se recargue.
                    -->
                    <form onsubmit="return validarLogin()">

                        <!-- Correo -->
                        <div class="mb-3">
                            <label for="login-email"
                                   class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="login-email">

                            <!-- JavaScript escribe aquí el error del correo -->
                            <div class="text-danger"
                                 id="error-login-email"></div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label for="login-password"
                                   class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="login-password">

                            <!-- JavaScript escribe aquí el error de contraseña -->
                            <div class="text-danger"
                                 id="error-login-password"></div>
                        </div>

                        <!-- Ejecuta el submit del formulario -->
                        <button type="submit"
                                class="btn btn-primary w-100">
                            Ingresar
                        </button>

                    </form>

                    <!-- Enlace al registro -->
                    <p class="text-center mt-3">
                        ¿No tienes cuenta?
                        <a href="registro.html">
                            Regístrate aquí
                        </a>
                    </p>

                </div>
            </div>
        </div>

    </div>
</div>


<!-- Bootstrap JS: permite funcionar al navbar responsive -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<!--
    JS propio:
    - validarLogin()
    - buscar usuario
    - guardar sesión
    - mostrar/ocultar opciones del menú
-->
<script src="js/app.js"></script>

</body>
</html>
