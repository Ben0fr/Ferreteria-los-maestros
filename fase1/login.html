<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ferretería Los Maestros</title>

    <!-- Bootstrap 5 (CSS) desde el CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Nuestro propio CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- Aquí empieza el menú (el mismo que en las otras páginas) -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
        <a class="navbar-brand" href="index.html">Ferretería Los Maestros</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="productos.html">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="nosotros.html">Nosotros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="carrito.html">Carrito</a>
                </li>

                <!-- Botones para iniciar sesión o crear una cuenta -->
                <li class="nav-item ms-lg-2" id="nav-login">
                    <a class="btn btn-outline-primary btn-sm" href="login.html">Iniciar Sesión</a>
                </li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0" id="nav-registro">
                    <a class="btn btn-primary btn-sm" href="registro.html">Registrarse</a>
                </li>

                <!-- Esto se muestra en vez de los botones de arriba cuando ya iniciaste sesión -->
                <li class="nav-item ms-lg-3 d-none" id="nav-usuario">
                    <span class="fw-bold" id="nav-usuario-nombre"></span>
                </li>
                <li class="nav-item ms-lg-2 mt-2 mt-lg-0 d-none" id="nav-logout">
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
                </li>
            </ul>
        </div>
    </div>
</nav>
<!-- Aquí termina el menú -->


<!-- Aquí empieza el formulario de inicio de sesión -->
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="mb-4 text-center">Iniciar Sesión</h1>

                    <!-- Cuando se envía el formulario, se llama a la función validarLogin() -->
                    <form onsubmit="return validarLogin()">

                        <!-- Campo de correo -->
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="login-email">
                            <!-- Acá JavaScript va a escribir el mensaje de error si el correo no es válido -->
                            <div class="text-danger" id="error-login-email"></div>
                        </div>

                        <!-- Campo de contraseña -->
                        <div class="mb-3">
                            <label for="login-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="login-password">
                            <!-- Acá JavaScript va a escribir el mensaje de error si la contraseña no es válida -->
                            <div class="text-danger" id="error-login-password"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <p class="text-center mt-3">
                        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Aquí termina el formulario de inicio de sesión -->


<!-- Bootstrap 5 (JS) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<!-- Nuestro propio JavaScript -->
<script src="js/app.js"></script>
</body>
</html>
