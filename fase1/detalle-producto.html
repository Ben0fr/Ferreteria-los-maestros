<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- Permite que la página se adapte a diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalle del Producto - Ferretería Los Maestros</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">

            <!-- Al presionar el nombre de la tienda vuelve al inicio -->
            <a class="navbar-brand" href="index.html">
                Ferretería Los Maestros
            </a>

            <!-- Este botón aparece cuando la pantalla es pequeña -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Opciones de navegación -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            Carrito
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Contenido principal de la página -->
    <main class="container mt-5 mb-5">

        <h1 class="mb-4">
            Detalle del Producto
        </h1>

        <!--
        Aquí JavaScript mostrará el detalle del producto.
        app.js obtiene el id desde la URL y busca el producto.
        -->
        <div id="detalle-producto">
        </div>

    </main>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="js/app.js"></script>

</body>
</html>
