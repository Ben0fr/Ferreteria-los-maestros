<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Hace que la página sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar Productos - Ferretería Los Maestros</title>

    <!-- Bootstrap: grillas, formularios, botones y tablas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- ================= PANEL ADMIN ================= -->
<div class="container-fluid">
    <div class="row min-vh-100">

        <!-- MENÚ LATERAL -->
        <aside class="col-md-3 col-lg-2 bg-dark text-white p-4">

            <h4 class="mb-4">
                Ferretería<br>
                Los Maestros
            </h4>

            <h6 class="text-secondary">
                Administración
            </h6>

            <nav class="nav flex-column">

                <a class="nav-link text-white"
                   href="admin.html">
                    Inicio
                </a>

                <!-- text-warning marca la sección actual -->
                <a class="nav-link text-warning"
                   href="admin-productos.html">
                    Productos
                </a>

                <a class="nav-link text-white"
                   href="admin-usuarios.html">
                    Usuarios
                </a>

                <hr>

                <a class="nav-link text-white"
                   href="index.html">
                    Volver a la tienda
                </a>

            </nav>
        </aside>


        <!-- ================= CONTENIDO ================= -->
        <main class="col-md-9 col-lg-10 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h1>Administrar Productos</h1>

                    <p class="text-muted">
                        Listado de productos disponibles en la tienda.
                    </p>
                </div>

                <!-- Bootstrap muestra u oculta el formulario -->
                <button class="btn btn-primary"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#formProducto">
                    Nuevo producto
                </button>

            </div>


            <!-- ================= FORMULARIO ================= -->
            <div class="collapse mb-5" id="formProducto">

                <div class="card">
                    <div class="card-body">

                        <h4 class="mb-4">
                            Nuevo Producto
                        </h4>

                        <!--
                            Al enviar se ejecuta guardarProductoAdmin()
                            desde admin.js.
                        -->
                        <form id="formulario-producto-admin"
                              onsubmit="return guardarProductoAdmin()">

                            <!-- Código y nombre -->
                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="admin-producto-codigo"
                                           class="form-label">
                                        Código
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="admin-producto-codigo"
                                           minlength="3"
                                           required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="admin-producto-nombre"
                                           class="form-label">
                                        Nombre
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="admin-producto-nombre"
                                           maxlength="100"
                                           required>
                                </div>

                            </div>


                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="admin-producto-descripcion"
                                       class="form-label">
                                    Descripción
                                </label>

                                <textarea class="form-control"
                                          id="admin-producto-descripcion"
                                          maxlength="500"
                                          rows="3"></textarea>
                            </div>


                            <!-- Precio, stock y stock crítico -->
                            <div class="row">

                                <div class="col-md-4 mb-3">
                                    <label for="admin-producto-precio"
                                           class="form-label">
                                        Precio
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="admin-producto-precio"
                                           min="0"
                                           step="0.01"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label for="admin-producto-stock"
                                           class="form-label">
                                        Stock
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="admin-producto-stock"
                                           min="0"
                                           step="1"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label for="admin-producto-stock-critico"
                                           class="form-label">
                                        Stock crítico
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="admin-producto-stock-critico"
                                           min="0"
                                           step="1">
                                </div>

                            </div>


                            <!-- Categoría e imagen -->
                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="admin-producto-categoria"
                                           class="form-label">
                                        Categoría
                                    </label>

                                    <select class="form-select"
                                            id="admin-producto-categoria"
                                            required>

                                        <option value="">
                                            Seleccionar
                                        </option>

                                        <option value="Herramientas manuales">
                                            Herramientas manuales
                                        </option>

                                        <option value="Herramientas eléctricas">
                                            Herramientas eléctricas
                                        </option>

                                        <option value="Materiales de construcción">
                                            Materiales de construcción
                                        </option>

                                        <option value="Pinturas">
                                            Pinturas
                                        </option>

                                        <option value="Seguridad y EPP">
                                            Seguridad y EPP
                                        </option>

                                        <option value="Ferretería general">
                                            Ferretería general
                                        </option>

                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="admin-producto-imagen"
                                           class="form-label">
                                        Imagen
                                    </label>

                                    <input type="file"
                                           class="form-control"
                                           id="admin-producto-imagen">
                                </div>

                            </div>


                            <!-- Guarda el producto con JavaScript -->
                            <button type="submit"
                                    class="btn btn-primary">
                                Guardar producto
                            </button>

                        </form>

                    </div>
                </div>
            </div>


            <!-- ================= TABLA DE PRODUCTOS ================= -->
            <div class="table-responsive">

                <table class="table table-striped table-bordered align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acción</th>
                        </tr>
                    </thead>

                    <!-- admin.js agrega aquí los productos -->
                    <tbody id="cuerpo-productos-admin">
                    </tbody>

                </table>

            </div>

        </main>
    </div>
</div>


<!-- Bootstrap JS: permite abrir/cerrar el formulario -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!--
    JS exclusivo del administrador:
    - crea productos
    - guarda en localStorage
    - muestra la tabla
    - edita productos
    - elimina productos
    - modifica stock
-->
<script src="js/admin.js"></script>

</body>
</html>
