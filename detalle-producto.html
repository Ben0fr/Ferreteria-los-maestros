    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- ================= MENÚ ================= -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <!-- Nombre de la tienda, vuelve al inicio -->
        <a class="navbar-brand" href="index.html">
            Ferretería Los Maestros
        </a>

        <!-- Botón responsive para pantallas pequeñas -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Enlaces principales -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="productos.html">
                        Productos
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="carrito.html">
                        Carrito
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>


<!-- ================= DETALLE DEL PRODUCTO ================= -->
<main class="container mt-5 mb-5">

    <h1 class="mb-4">
        Detalle del Producto
    </h1>

    <!--
        Este div queda vacío porque app.js genera el contenido.

        JavaScript:
        1. obtiene el id desde la URL
        2. busca el producto en el arreglo
        3. muestra sus datos aquí
    -->
    <div id="detalle-producto">
    </div>

</main>


<!-- Bootstrap JS: permite funcionar al navbar responsive -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!--
    JS propio:
    - obtiene el id del producto desde la URL
    - busca el producto
    - muestra su detalle
    - permite agregarlo al carrito
-->
<script src="js/app.js"></script>
