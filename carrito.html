<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Hace que la página sea responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito de Compras</title>

    <!-- Bootstrap: diseño responsive y componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<!-- ================= MENÚ ================= -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <!-- Nombre de la tienda, vuelve al inicio -->
        <a class="navbar-brand" href="index.html">
            Ferretería los maestros
        </a>

        <!-- Enlaces principales -->
        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="index.html">
                Inicio
            </a>

            <a class="nav-link" href="productos.html">
                Productos
            </a>

            <a class="nav-link" href="carrito.html">
                Carrito
            </a>

        </div>
    </div>
</nav>


<!-- ================= CARRITO ================= -->
<main class="container mt-5 mb-5">

    <h1>Carrito de Compras</h1>

    <!--
        app.js muestra aquí los productos guardados
        en localStorage.
    -->
    <div id="contenedor-carrito">
    </div>

    <!-- Resumen del carrito -->
    <div class="card mt-4 resumen-carrito">
        <div>

            <!-- JavaScript actualiza aquí el total -->
            <h3>
                total: $<span id="total-carrito">0</span>
            </h3>

            <!-- Ejecuta vaciarCarrito() desde app.js -->
            <button class="btn btn-danger"
                    onclick="vaciarCarrito()">
                Vaciar Carrito
            </button>

        </div>
    </div>

</main>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<!--
    JS propio:
    - recupera el carrito desde localStorage
    - muestra los productos
    - calcula el total
    - permite eliminar o vaciar el carrito
-->
<script src="js/app.js"></script>

</body>
</html>
