<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <!-- Al hacer clic en el nombre de la tienda vuelve al inicio -->
            <a class="navbar-brand" href="index.html">Ferretería los maestros</a>
            <!-- Enlaces principales -->
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Inicio</a>
                <a class="nav-link" href="productos.html">Productos</a>
                <a class="nav-link" href="carrito.html">Carrito </a>
            </div>
        </div>
    </nav>
    <!-- Contenido principal del carrito -->
    <main class="container mt-5 mb-5">
        <h1>Carrito de Compras</h1>
        <!-- Aqui java script mostrara el contenido del carrito -->
        <div id="contenedor-carrito">
        </div>
        <!-- Bloque en donde se muestra el resumen del carrito -->
        <div class="mt-4 resumen-carrito">
            <div>
                <!-- Muestra el total del carrito-->
                <h3>
                    total: $<span id="total-carrito">0</span>
                </h3>
                <!-- Botón para vaciar el carrito -->
                <button class="btn btn-danger" onclick="vaciarCarrito()">Vaciar Carrito</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
